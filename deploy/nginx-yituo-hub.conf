server {
    listen 80;
    listen [::]:80;
    server_name studio.yituohub.com yituohub.com www.yituohub.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        return 301 https://studio.yituohub.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name studio.yituohub.com;

    root /var/www/yituo-hub;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/studio.yituohub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studio.yituohub.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
    location = /l {
        return 302 /l/;
    }
    location ^~ /l/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }
    location /motion/ { expires 1d; add_header Cache-Control "public, max-age=86400"; }
    location /assets/ { expires 1d; add_header Cache-Control "public, max-age=86400"; }
    location /vendor/ { expires 1d; add_header Cache-Control "public, max-age=86400"; }
}
