<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Yi Tuo Hub · 排版工坊</title>
<meta name="description" content="粘贴 Markdown，一键排版为可直接粘贴到微信公众号编辑器的精致 HTML；18 套基础主题与 15 套高级排版（蓝梦原创视觉）"/>
<link rel="stylesheet" href="styles.css"/>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
</head>
<body>
<header class="topbar rise">
  <div class="brand">
    <span class="logo">
      <svg width="34" height="34" viewBox="0 0 48 48" aria-hidden="true">
        <defs>
          <linearGradient id="yt-logo" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#33546F"/><stop offset="1" stop-color="#1D3045"/>
          </linearGradient>
        </defs>
        <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#yt-logo)"/>
        <g stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round">
          <line x1="24" y1="27" x2="24" y2="14"/>
          <line x1="24" y1="27" x2="13.5" y2="34.5"/>
          <line x1="24" y1="27" x2="34.5" y2="34.5"/>
        </g>
        <circle cx="24" cy="27" r="4.4" fill="#FFFFFF"/>
        <circle cx="24" cy="12.8" r="3.1" fill="#FFFFFF"/>
        <circle cx="12.8" cy="35.2" r="3.1" fill="#FFFFFF"/>
        <circle cx="35.2" cy="35.2" r="3.1" fill="#FFFFFF"/>
      </svg>
    </span>
    <div>
      <h1>YI TUO HUB <em>公众号排版工坊</em></h1>
      <p>Markdown → WeChat HTML Studio</p>
    </div>
  </div>
  <div class="actions">
    <a class="btn icon-round" href="https://github.com/yan9651688/yituo-hub" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
    </a>
    <a class="btn ghost" href="index.html">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      首页
    </a>
    <button id="btnDownload" class="btn ghost">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      下载 HTML
    </button>
    <button id="btnCopy" class="btn primary">
      复制到公众号
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </button>
  </div>
</header>

<main class="workspace rise" style="animation-delay:.08s">
  <section class="pane editor-pane">
    <div class="pane-toolbar">
      <strong>Markdown</strong>
      <span id="themePickerSlot" class="picker-slot"></span>
      <span id="levelPickerSlot" class="level-picker-slot" hidden></span>
      <button id="motionModeBtn" class="btn tiny ghost motion-mode-btn" type="button" hidden></button>
      <span class="spacer"></span>
      <label class="author-field">署名 <input id="authorInput" type="text" placeholder="你的名字（可空）" maxlength="24"/></label>
      <button id="btnSample" class="btn tiny ghost">载入示例</button>
      <button id="btnClear" class="btn tiny ghost">清空</button>
    </div>
    <textarea id="editor" spellcheck="false" placeholder="把文章 Markdown 粘进来，右侧立即预览…&#10;&#10;支持：# 标题 / ## 章节 / **加粗**(自动升级为关键词下划线) / ==高亮== / ++下划线++ / 代码块 / 图片 / 表格 / 引用"></textarea>
  </section>

  <section class="pane preview-pane">
    <div class="pane-toolbar">
      <strong>公众号预览</strong>
      <span id="validBadge" class="badge">校验中…</span>
      <span class="spacer"></span>
      <div class="width-toggle">
        <button id="widthFit" class="btn tiny ghost active">适应</button>
        <button id="widthPhone" class="btn tiny ghost">📱 375px</button>
      </div>
    </div>
    <div class="preview-wrap" id="previewWrap">
      <iframe id="preview" title="排版预览"></iframe>
    </div>
    <div id="validPanel" class="valid-panel" hidden></div>
  </section>
</main>

<footer class="foot rise" style="animation-delay:.2s">
  基于 <a href="https://github.com/isjiamu/gzh-design-skill" target="_blank" rel="noopener">gzh-design-skill</a>
  与 <a href="https://github.com/lanmengSakura/wechat-motion-layout-studio" target="_blank" rel="noopener">wechat-motion-layout-studio</a>
  融合打造 · AGPL-3.0 开源
</footer>

<div id="toast" class="toast" hidden></div>

<script src="vendor/marked.min.js"></script>
<script src="themes.js"></script>
<script src="converter.js"></script>
<script src="validator.js"></script>
<script src="original-visuals-data.js"></script>
<script src="original-visuals.js"></script>
<script src="app.js"></script>
</body>
</html>
