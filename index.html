<script>
(function () {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var layers = document.querySelectorAll('[data-depth]');
  addEventListener('mousemove', function (e) {
    var mx = e.clientX / innerWidth - 0.5;
    var my = e.clientY / innerHeight - 0.5;
    layers.forEach(function (el) {
      var d = parseFloat(el.dataset.depth) || 0;
      el.style.transform = 'translate3d(' + (mx * d * 42).toFixed(1) + 'px,' + (my * d * 16).toFixed(1) + 'px,0)';
    });
  }, { passive: true });

  /* 鼠标动效：小点即时跟随 + 圆环延迟追随，悬停交互元素放大 */
  try {
    if (matchMedia('(pointer:fine)').matches && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    var dot = document.createElement('div'); dot.className = 'cursor-dot';
    var ring = document.createElement('div'); ring.className = 'cursor-ring';
    document.body.appendChild(dot); document.body.appendChild(ring);
    var tx = innerWidth / 2, ty = innerHeight / 2, rx = tx, ry = ty;
    addEventListener('mousemove', function (e) {
      tx = e.clientX; ty = e.clientY;
      dot.style.left = tx + 'px'; dot.style.top = ty + 'px';
      var t = e.target;
      ring.classList.toggle('hover', !!(t.closest && t.closest('a, button')));
    }, { passive: true });
    (function loop() {
      rx += (tx - rx) * 0.16; ry += (ty - ry) * 0.16;
      ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
      requestAnimationFrame(loop);
    })();
      document.body.classList.add('cursor-ready');
    }
  } catch (e) {
    var d = document.querySelector('.cursor-dot'), r = document.querySelector('.cursor-ring');
    if (d) d.remove(); if (r) r.remove();
  }
})();
</script>
